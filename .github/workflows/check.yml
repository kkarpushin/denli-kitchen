name: Prototype checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm test
      - run: node --check app.mjs
      - run: npm run build
      - run: npm run examples && git diff --exit-code -- examples
      - run: python3 -m py_compile qa/browser_test.py qa/browser_provenance.py
